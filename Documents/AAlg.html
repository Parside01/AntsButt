<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ants Butt ept</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Underdog&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="root.css">
    <style>
        :root {
            --dark-background: #121212;
            --dark-card-background: #212121;
            --text: #ffffff;
            --dark-button-text: #212121;
            --yellow-shadow: rgba(255, 235, 59, 0.2);
            --yellow-button-background: #ffeb3b;
            --maze-background: #464646;
            --maze-wall: #1e1e1e;
            --maze-path: #00bcd4;
            --maze-found: #ffffff;
            --maze-review: #ffc107;
            --maze-dead: #ff5722;
        }

        * {
            box-sizing: border-box;
            font-family: "Underdog" !important;
            color: var(--text);
            font-weight: 700 !important;
        }

        body {
            background-color: var(--dark-background);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 40px;
            padding: 40px;
            background-color: var(--dark-card-background);
            border-radius: 24px;
            box-shadow: 0px 0px 12px 0px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .cells-wrapper {
            display: grid;
            grid-template-columns: repeat(25, 20px);
            grid-template-rows: repeat(25, 20px);
            padding: 10px;
            width: auto;
            height: auto;
            border-radius: 8px;
            background-color: var(--maze-wall);
        }

        .cell {
            transition: background-color 0.2s ease;
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            background-color: var(--maze-background);
        }

        .cell.cell--wall {
            background-color: var(--maze-wall);
        }

        .cell.cell--path {
            background-color: var(--maze-path);
        }

        .cell--path-found {
            background-color: var(--maze-found);
        }

        .cell--review {
            background-color: var(--maze-review);
            color: #212121;
        }

        .cell--dead {
            background-color: rgba(var(--maze-dead-rgb, 255, 87, 34), 0.5);
        }

        .form-control {
            background-color: var(--dark-background);
            color: var(--text);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            outline: none;
            width: 120px;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .cell--temp {
            border-color: var(--maze-review);
            border: solid 1px var(--maze-review);
        }

        .bttn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 12px;
            gap: 6px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.3em;
            background-color: var(--yellow-button-background);
            border-color: var(--yellow-button-background);
            color: var(--dark-button-text);
            cursor: pointer;
            font-weight: 700 !important;
            width: auto;
        }

        .bttn.disable {
            background-color: var(--yellow-shadow);
            border-color: var(--yellow-shadow);
        }

        .bttn {
            transition: transform 0.1s ease-in-out;
        }

        .bttn:hover {
            transform: scale(0.95);
        }

        .bttn:active {
            transform: scale(0.9);
        }

        .bttn.disable {
            background-color: var(--yellow-shadow);
            border-color: var(--yellow-shadow);
            color: var(--dark-button-text);
        }
    </style>
</head>
<body>
    <nav>
        <ul class="nav nav-tabs">
          <li class="nav-item"><a class="nav-link" href="../index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="./AAlg.html">A*</a></li>
          <li class="nav-item"><a class="nav-link" href="./Claster/index.html">Кластеризация</a></li>
          <li class="nav-item"><a class="nav-link" href="./GeneticAlg/index.html">Генетический алгоритм</a></li>
          <li class="nav-item"><a class="nav-link" href="./Ants/index.html">Муравьиный алгоритм</a></li>
          <li class="nav-item"><a class="nav-link" href="./DecisionTree/index.html">Дерево решений</a></li>
          <li class="nav-item"><a class="nav-link" href="./NeuralNetwork.html">Нейросеть</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="controls">
            <input value="" type="number" id="cell-count" class="form-control" placeholder="Размер"/>
            <button id="find-path" class="bttn">Найти</button>
        </div>
        <div class="cells-wrapper"></div>
    </div>


<script>
    $(document).ready(function () {

        let cellCount = 25;

        function IsValidCellCoords(x, y) {
            return x >= 0 && x < cellCount && y >= 0 && y < cellCount;
        }

        function GetCellKey(x, y) {
            return `${x},${y}`;
        }

        const unionFind = {
            parents: {},

            findRepresentative(x, y) {
                const key = GetCellKey(x, y);

                if (!this.parents[key]) {
                    return null;
                }

                if (this.parents[key] != key) {
                    const [parentX, parentY] = this.parents[key]
                        .split(",")
                        .map(Number);
                    this.parents[key] = this.findRepresentative(parentX, parentY);
                }
                return this.parents[key];
            },

            unite(ax, ay, bx, by) {
                const aRep = this.findRepresentative(ax, ay);
                const bRep = this.findRepresentative(bx, by);
                this.parents[aRep] = bRep;
            },
        };

        async function SetCellSize() {
            const wrapperWidth = $(".cells-wrapper").width();
            const wrapperHeight = $(".cells-wrapper").height();
            const cellSize = Math.min(
                wrapperWidth / cellCount,
                wrapperHeight / cellCount
            );

            $(".cells-wrapper").css({
                "grid-template-columns": `repeat(${cellCount}, ${cellSize}px)`,
                "grid-template-rows": `repeat(${cellCount}, ${cellSize}px)`,
            });
            $(".cell").css({
                width: `${cellSize}px`,
                height: `${cellSize}px`,
            });
        }

        function GetRandomCell() {
            const max = Math.floor((cellCount - 1) / 2);
            const x = Math.floor(Math.random() * (max + 1)) * 2;
            const y = Math.floor(Math.random() * (max + 1)) * 2;
            return $(`.cell[x="${x}"][y="${y}"]`);
        }

        function GetRandomDir() {
            const bias = 0.5;
            const rand = Math.random();
            if (rand < bias) {
                return Math.random() < 0.5 ? {x: -1, y: 0} : {x: 1, y: 0};
            } else {
                return Math.random() < 0.5 ? {x: 0, y: -1} : {x: 0, y: 1};
            }
        }

        async function IterateKruskal() {
            let attempts = 0;
            const maxAttempts = 101;
            while (attempts++ < maxAttempts) {
                const cellA = GetRandomCell();
                if (!cellA.length) continue;

                const dir = GetRandomDir();
                const ax = parseInt(cellA.attr("x"));
                const ay = parseInt(cellA.attr("y"));

                const wx = ax + dir.x;
                const wy = ay + dir.y;

                const bx = ax + dir.x * 2;
                const by = ay + dir.y * 2;

                if (
                    !IsValidCellCoords(ax, ay) ||
                    !IsValidCellCoords(wx, wy) ||
                    !IsValidCellCoords(bx, by)
                )
                    continue;

                const wall = $(`.cell[x="${wx}"][y="${wy}"]`);
                const neighborCell = $(`.cell[x="${bx}"][y="${by}"]`);

                if (!wall.length || !neighborCell.length) continue;
                if (!wall.hasClass("cell--wall")) continue;

                if (
                    unionFind.findRepresentative(ax, ay) ===
                    unionFind.findRepresentative(bx, by)
                )
                    continue;

                wall.removeClass("cell--wall");
                unionFind.unite(ax, ay, bx, by);
                return;
            }
        }

        async function GenerateMaze() {
            unionFind.parents = {};
            for (let x = 0; x < cellCount; x++) {
                for (let y = 0; y < cellCount; y++) {
                    const key = GetCellKey(x, y);
                    unionFind.parents[key] = key;
                }
            }

            const iterNum = ((Number(cellCount) - 1) * (Number(cellCount) + 3)) / 4;
            for (let i = 0; i < iterNum; ++i) {
                await IterateKruskal();
                await sleep(1);
            }
        }

        async function GenerateCell() {
            $(".cell").remove();

            for (let x = 0; x < cellCount; x++) {
                for (let y = 0; y < cellCount; y++) {
                    let cell = $(`<div class="cell" x=${x} y=${y}></div>`);
                    if (x % 2 === 1 || y % 2 === 1) {
                        cell.addClass("cell--wall");
                    }
                    $(".cells-wrapper").append(cell);
                }
            }

            $("#find-path").addClass("disable");
            await SetCellSize();
            await GenerateMaze();
            $("#find-path").removeClass("disable");
        }

        GenerateCell();

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function SelectCell(cell) {
            cell.removeClass();
            cell.addClass("cell cell--wall");
        }

        function UnselectedCell(cell) {
            cell.removeClass("cell--wall");
            if (!cell.hasClass("cell")) {
                cell.addClass("cell");
            }
        }

        function AddPathCell(cell) {
            cell.removeClass("cell--wall");
            $(".cell").removeClass("cell--path-found");

            if (cell.hasClass("cell--path")) {
                cell.removeClass("cell--path");
                return;
            }

            const pathCells = $(".cell--path");

            if (pathCells.length >= 2) {
                return;
                // const oldestCell = pathCells.first();
                // oldestCell.removeClass("cell--path");
            }

            cell.addClass("cell--path");
            const updatedPathCells = $(".cell--path");
        }

        $(document).on("click", ".cell", function (event) {
            if ($(this).hasClass("cell--path"))return;
            if ($(this).hasClass("cell--wall")) {
                UnselectedCell($(this));
            } else {
                SelectCell($(this));
            }
        });

        $(document).on("contextmenu", ".cell", function (event) {
            event.preventDefault();
            AddPathCell($(this));
        });

        $(window).resize(function () {
            SetCellSize();
        });

        $(document).keydown(async function (event) {
            if (event.key === "Enter") {
                if ($("#find-path").hasClass("disable")) return;
                cellCount = Number($("#cell-count").val());
                await GenerateCell();
            }
        });

        async function FindPath(startX, startY, endX, endY) {
            $(".cell").removeClass("cell--dead");
            const queue = [];
            const visited = new Set();

            const startNode = {
                x: startX,
                y: startY,
                value: 0,
                heuristics: Math.abs(startX - endX) + Math.abs(startY - endY),
                parent: null,
            };
            startNode.value = startNode.heuristics;
            queue.push(startNode);

            let prevCell = null;
            while (queue.length > 0) {
                $(".cell").removeClass("cell--review");

                queue.sort((a, b) => b.value - a.value);
                const currentCell = queue.pop();
                visited.add(GetCellKey(currentCell.x, currentCell.y));

                $(`.cell[x="${currentCell.x}"][y="${currentCell.y}"]`).addClass(
                    "cell--review"
                );

                if (
                    prevCell &&
                    (prevCell.x - currentCell.x > 1 || prevCell.y - currentCell.y > 1)
                ) {
                    $(`.cell[x="${prevCell.x}"][y="${prevCell.y}"]`).addClass(
                        "cell--dead"
                    );
                }

                if (currentCell.x === endX && currentCell.y === endY) {
                    const path = [];
                    let current = currentCell;
                    while (current !== null) {
                        path.push({x: current.x, y: current.y});
                        current = current.parent;
                    }
                    return path.reverse();
                }

                const directions = [
                    {dx: 1, dy: 0},
                    {dx: -1, dy: 0},
                    {dx: 0, dy: 1},
                    {dx: 0, dy: -1},
                ];
                for (const dir of directions) {
                    const x = currentCell.x + dir.dx;
                    const y = currentCell.y + dir.dy;

                    if (!IsValidCellCoords(x, y)) continue;

                    const cell = $(`.cell[x="${x}"][y="${y}"]`);
                    if (!cell || cell.hasClass("cell--wall")) continue;

                    if (visited.has(GetCellKey(x, y))) continue;
                    
                    cell.addClass("cell--temp");
                    console.log(cell)
                }

                for (const dir of directions) {
                    const x = currentCell.x + dir.dx;
                    const y = currentCell.y + dir.dy;

                    if (!IsValidCellCoords(x, y)) continue;

                    const cell = $(`.cell[x="${x}"][y="${y}"]`);
                    if (!cell || cell.hasClass("cell--wall")) continue;

                    if (visited.has(GetCellKey(x, y))) continue;

                    const newHeuristics = Math.abs(x - endX) + Math.abs(y - endY);
                    const nextCell = {
                        x,
                        y,
                        heuristics: newHeuristics,
                        value: newHeuristics,
                        parent: currentCell,
                    };

                    const existingCell = queue.find((n) => n.x === x && n.y === y);
                    if (existingCell) {
                        continue;
                    }
                    queue.push(nextCell);
                }
                prevCell = currentCell;
                await sleep(100);
                $(".cell").removeClass("cell--temp")
            }

            return null;
        }

        async function FindAndDrawPath() {
            $("#find-path").addClass("disable");
            $(".cell--path-found").removeClass("cell--path-found");
            const pathCells = $(".cell--path");
            if (pathCells.length !== 2) {
                alert("Выберите 2 клетки для маршрута!");
                $("#find-path").removeClass("disable");
                return;
            }

            const start = {
                x: parseInt(pathCells.eq(0).attr("x")),
                y: parseInt(pathCells.eq(0).attr("y")),
            };
            const end = {
                x: parseInt(pathCells.eq(1).attr("x")),
                y: parseInt(pathCells.eq(1).attr("y")),
            };

            const path = await FindPath(start.x, start.y, end.x, end.y);
            if (path) {
                path.forEach((point) => {
                    const cell = $(`.cell[x="${point.x}"][y="${point.y}"]`);
                    if (!cell.hasClass("cell--path")) {
                        cell.removeClass("cell--dead cell--review");
                        cell.addClass("cell--path-found");
                    }
                });
            } else {
                alert("Не получилось найти путь!");
            }

            $("#find-path").removeClass("disable");
        }

        $("#find-path").click(function () {
            if ($(this).hasClass("disable")) return;
            FindAndDrawPath()
        });
    });
</script>

<script></script>
</body>
</html>
