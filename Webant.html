<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Муравьиный алгоритм</title>
  <style>
    body {
      background-color: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #1e1e1e;
      padding: 20px 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-weight: normal;
      margin-bottom: 20px;
      text-align: center;
    }

    canvas {
      background-color: #2e2e2e;
      border-radius: 10px;
      cursor: crosshair;
      margin-bottom: 20px;
    }

    button {
      background-color: #ffeb3b;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #fdd835;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Задача коммивояжёра — Муравьиный алгоритм</h1>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div>
      <button onclick="startAntColony()">Запустить алгоритм</button>
      <button onclick="reset()">Сбросить</button>
    </div>
  </div>

  <!-- Подключаем внешний файл JavaScript -->
  <script src="ants.js"></script>
</body>
</html>
