    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script>
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        class NodeRegression {
            constructor() {
                this.featureIndex = -1;
                this.threshold = 0.0;
                this.predictValue = 0.0;
                this.left = null;
                this.right = null;
                this.isLeaf = false;
            }
        };

        function calculatePredictRegression(data, indixes) {
            if (indixes.length === 0) {
                return 0.0;
            }

            let sum = 0.0;
            for (const index of indixes) {
                sum += data[index][data[0].length - 1];
            }

            return sum / indixes.length;
        }

        function calculateSME(data, indixes, predict) {
            if (indixes.length === 0) {
                return 0.0;
            }

            let mse = 0.0;
            for (const index of indixes) {
                let error = data[index][data[0].length - 1] - predict;
                mse += Math.pow(error, 2);
            }

            return mse / indixes.length;
        }

        function calculateIGRegression(mseParent, nLeft, mseLeft, nRight, mseRight, nParent) {
            const informationGain = mseParent - ((nLeft / nParent) * mseLeft + (nRight / nParent) * mseRight);
            return informationGain;
        }

        function chooseTheBestSplitRegression(data, indixes) {
            let bestNode = new NodeRegression();
            let bestIG = -Infinity;

            const numberFeatures = data[0].length - 1;
            const numberExamples = indixes.length;

            const predictParent = calculatePredictRegression(data, indixes);
            const mseParent = calculateSME(data, indixes, predictParent);

            for (let featureIndex = 0; featureIndex < numberFeatures; featureIndex++) {
                let uniqueValues = [];
                for (let i = 0; i < indixes.length; i++) {
                    const index = indixes[i];
                    let isUnique = true;
                    for (let k = 0; k < uniqueValues.length; k++) {
                        if (data[index][featureIndex] === uniqueValues[k]) {
                            isUnique = false;
                            break;
                        }
                    }

                    if (isUnique) {
                        uniqueValues.push(data[index][featureIndex]);
                    }
                }

                for (const threshold of uniqueValues) {
                    let leftIndixes = [];
                    let rightIndixes = [];

                    for (let i = 0; i < indixes.length; ++i) {
                        const index = indixes[i];
                        if (data[index][featureIndex] <= threshold) {
                            leftIndixes.push(index);
                        }
                        else {
                            rightIndixes.push(index);
                        }
                    }

                    let predictLeft = calculatePredictRegression(data, leftIndixes);
                    let mseLeft = calculateSME(data, leftIndixes, predictLeft);

                    let predictRight = calculatePredictRegression(data, rightIndixes);
                    let mseRight = calculateSME(data, rightIndixes, predictRight);

                    let informationGain = calculateIGRegression(mseParent, leftIndixes.length, mseLeft, rightIndixes.length, mseRight, numberExamples);

                    if (informationGain > bestIG) {
                        bestIG = informationGain;
                        bestNode.featureIndex = featureIndex;
                        bestNode.threshold = threshold;
                    }
                }
            }

            return bestNode;
        }

        function buildTreeRegression(data, indixes, maxDepth, currentDepth = 0, minSamplesSplit = 2) {
            if (indixes.length === 0) {
                return null;
            }

            if (indixes.length < minSamplesSplit) {
                let leaf = new NodeRegression();
                leaf.isLeaf = true;
                leaf.predictValue = calculatePredictRegression(data, indixes);

                return leaf;
            }

            if (currentDepth >= maxDepth) {
                let leaf = new NodeRegression();
                leaf.isLeaf = true;
                leaf.predictValue = calculatePredictRegression(data, indixes);

                return leaf;
            }

            let temp = chooseTheBestSplitRegression(data, indixes);

            if (temp.featureIndex === -1) {
                let leaf = new NodeRegression();
                leaf.isLeaf = true;
                leaf.predictValue = calculatePredictRegression(data, indixes);

                return leaf;
            }

            let node = new NodeRegression();
            node.featureIndex = temp.featureIndex;
            node.threshold = temp.threshold;

            let leftIndixes = [];
            let rightIndixes = [];

            for (const index of indixes) {
                if (data[index][node.featureIndex] <= node.threshold) {
                    leftIndixes.push(index);
                }
                else {
                    rightIndixes.push(index);
                }
            }

            node.left = buildTreeRegression(data, leftIndixes, maxDepth, currentDepth + 1);
            node.right = buildTreeRegression(data, rightIndixes, maxDepth, currentDepth + 1);

            return node;
        }

        function predictRegression(tree, example) {
            let current = tree;

            while (!current.isLeaf && current !== null) {
                if (example[current.featureIndex] <= current.threshold) {
                    current = current.left;
                }
                else {
                    current = current.right;
                }
            }

            return current ? current.predictValue : 0.0;
        }

        function deleteTreeRegression(node) {
            if (node === null) {
                return;
            }

            deleteTreeRegression(node.left);
            deleteTreeRegression(node.right);
        }

        function chooseOptimalDepthRegression(data) {
            const minDepth = 2;
            const maxDepth = data.length - 1;

            let bestDepth = minDepth;
            let bestMAE = Infinity;

            for (let depth = minDepth; depth <= maxDepth; depth++) {
                let testSize = Math.round(data.length * 0.6);
                let indixesTest = [];
                let indixesTraining = [];

                let indixes = Array.from({ length: data.length }, (_, i) => i);
                shuffleArray(indixes);

                for (let i = 0; i < testSize; ++i) {
                    indixesTest.push(indixes[i]);
                }
                for (let i = testSize; i < data.length; ++i) {
                    indixesTraining.push(indixes[i]);
                }

                let root = buildTreeRegression(data, indixesTraining, depth);

                let mae = 0.0;
                for (let i = 0; i < indixesTest.length; i++) {
                    const index = indixesTest[i];
                    let features = data[index].slice(0, data[index].length - 1);
                    let prediction = predictRegression(root, features);
                    mae += Math.abs(prediction - data[index][data[index].length - 1]);
                }
                mae /= indixesTest.length;
                console.log("depth: ", depth, " mae: ", mae);
                if (mae < bestMAE) {
                    bestMAE = mae;
                    bestDepth = depth;
                }
            }
            return bestDepth;
        }

        class NodeClassification {
            constructor() {
                this.featureIndex = -1;
                this.threshold = 0.0;
                this.left = null;
                this.right = null;
                this.isLeaf = false;
                this.predictedClass = 0.0;
            }
        }

        function calculateEntropy(data, indixes) {
            if (indixes.length === 0) {
                return 0.0;
            }

            let classCounts = {};

            for (const index of indixes) {
                let classValue = data[index][data[0].length - 1];
                classCounts[classValue] = (classCounts[classValue] || 0) + 1;
            }

            let entropy = 0.0;
            const total = indixes.length;

            for (const classValue in classCounts) {
                const count = classCounts[classValue];
                let probability = count / total;

                if (probability > 0.0) {
                    entropy -= probability * Math.log2(probability);
                }
            }

            return entropy;
        }

        function calculateIGClassification(entropyParent, nLeft, entropyLeft, nRight, entropyRight, nParent) {
            const informationGain = entropyParent - ((nLeft / nParent) * entropyLeft) - ((nRight / nParent) * entropyRight);

            return informationGain;
        }

        function chooseTheBestSplitClassification(data, indixes) {
            let bestNode = new NodeClassification();
            let bestIG = -Infinity;

            const entropyParent = calculateEntropy(data, indixes);
            const numberFeatures = data[0].length - 1;

            for (let featureIndex = 0; featureIndex < numberFeatures; featureIndex++) {
                let uniqueValues = new Set();
                for (const index of indixes) {
                    uniqueValues.add(data[index][featureIndex]);
                }

                for (const threshold of uniqueValues) {
                    let leftIndixes = [];
                    let rightIndixes = [];

                    for (const index of indixes) {
                        if (data[index][featureIndex] <= threshold) {
                            leftIndixes.push(index);
                        }
                        else {
                            rightIndixes.push(index);
                        }
                    }

                    const entropyLeft = calculateEntropy(data, leftIndixes);
                    const entropyRight = calculateEntropy(data, rightIndixes);

                    const informationGain = calculateIGClassification(entropyParent, leftIndixes.length, entropyLeft, rightIndixes.length, entropyRight, indixes.length);

                    if (informationGain > bestIG) {
                        bestIG = informationGain;
                        bestNode.featureIndex = featureIndex;
                        bestNode.threshold = threshold;
                    }
                }
            }

            return bestNode;
        }

        function calculatePredictClassification(data, indixes) {
            if (indixes.length === 0) {
                return 0.0;
            }

            let classCounts = {};
            for (const index of indixes) {
                let classValue = data[index][data[0].length - 1];
                classCounts[classValue] = (classCounts[classValue] || 0) + 1;
            }

            let predictedClass = 0.0;
            let maxCount = 0;
            for (const classValue in classCounts) {
                const count = classCounts[classValue];

                if (count > maxCount) {
                    maxCount = count;
                    predictedClass = parseFloat(classValue);
                }
            }

            return predictedClass;
        }

        function predictClassification(tree, example) {
            let current = tree;

            while (current && !current.isLeaf) {
                if (example[current.featureIndex] <= current.threshold) {
                    current = current.left;
                } else {
                    current = current.right;
                }
            }

            return current ? current.predictedClass : 0.0;
        }

        function buildTreeClassification(data, indixes, maxDepth, currentDepth = 0, minSamplesSplit = 2) {
            if (indixes.length === 0) {
                return null;
            }

            if (indixes.length < minSamplesSplit) {
                let leaf = new NodeClassification();
                leaf.isLeaf = true;
                leaf.predictedClass = calculatePredictClassification(data, indixes);

                return leaf;
            }

            if (currentDepth >= maxDepth) {
                let leaf = new NodeClassification();
                leaf.isLeaf = true;
                leaf.predictedClass = calculatePredictClassification(data, indixes);

                return leaf;
            }

            let bestNode = chooseTheBestSplitClassification(data, indixes);

            if (bestNode.featureIndex === -1) {
                let leaf = new NodeClassification();
                leaf.isLeaf = true;
                leaf.predictedClass = calculatePredictClassification(data, indixes);

                return leaf;
            }

            let node = new NodeClassification();
            node.featureIndex = bestNode.featureIndex;
            node.threshold = bestNode.threshold;

            let leftIndixes = [];
            let rightIndixes = [];

            for (const index of indixes) {
                if (data[index][node.featureIndex] <= node.threshold) {
                    leftIndixes.push(index);
                }
                else {
                    rightIndixes.push(index);
                }
            }

            node.left = buildTreeClassification(data, leftIndixes, maxDepth, currentDepth + 1, minSamplesSplit);
            node.right = buildTreeClassification(data, rightIndixes, maxDepth, currentDepth + 1, minSamplesSplit);

            return node;
        }

        function deleteTreeClassification(node) {
            if (node === null) {
                return;
            }

            deleteTreeClassification(node.left);
            deleteTreeClassification(node.right);
        }

        function chooseOptimalDepthClassification(data) {
            const minDepth = 2;
            const maxDepth = data.length - 1;
            let averageDepth = new Set();

            let bestDepth = minDepth;
            let accuracy = 0;

            for (let depth = minDepth; depth <= maxDepth; depth++) {
                const testSize = Math.round(data.length * 0.6);
                const indixesTest = [];
                const indixesTraining = [];

                const indixes = Array.from({ length: data.length }, (_, i) => i);
                shuffleArray(indixes);

                for (let i = 0; i < testSize; ++i) {
                    indixesTest.push(indixes[i]);
                }
                for (let i = testSize; i < data.length; ++i) {
                    indixesTraining.push(indixes[i]);
                }

                const root = buildTreeClassification(data, indixesTraining, depth);
                let rightAnswers = 0;

                if (indixesTest.length > 0) {
                    for (let i = 0; i < indixesTest.length; ++i) {
                        const index = indixesTest[i];
                        let check = data[index];
                        let features = check.slice(0, check.length - 1);

                        const prediction = predictClassification(root, features);
                        if (prediction === data[index][data[index].length - 1]) {
                            rightAnswers++;
                        }
                    }

                    const tempAccuracy = rightAnswers / indixesTest.length;
                    console.log(depth, tempAccuracy);

                    if (accuracy <= tempAccuracy) {
                        accuracy = tempAccuracy;
                        bestDepth = depth;
                    }
                }
                averageDepth.add(bestDepth);

                deleteTreeClassification(root);
            }

            let averageDepthArray = Array.from(averageDepth).sort((a, b) => a - b);

            const middleIndex = Math.floor(averageDepthArray.length / 2);
            const optimalDepth = averageDepthArray[middleIndex];

            return optimalDepth;
        }

        function main() {
            const training_data = [
                [62, 33.5, 120, 1],

                [24, 20.3, 77, 0],
                [49, 29.5, 103, 0],
                [37, 25.0, 91, 0],
                [56, 31.0, 128, 1],
                [30, 22.7, 86, 0],

                [67, 34.7, 143, 1],
                [27, 21.3, 79, 0],
                [51, 30.0, 106, 0],

                [58, 31.6, 134, 1],
                [22, 20.0, 74, 0],

                [59, 32.0, 131, 1],
                [32, 23.4, 89, 0],
                [43, 27.0, 114, 0],
                [66, 34.3, 126, 1],
            ];

            const all_indices = Array.from({ length: training_data.length }, (_, i) => i);

            const depth = chooseOptimalDepthClassification(training_data);

            const test_example = [66, 34.3, 126];

            const root = buildTreeClassification(training_data, all_indices, depth);

            const prediction = predictClassification(root, test_example);

            console.log("Best depth: ", depth);

        main();

    <script>
        function csvToArray(csvText) {
            let lines = csvText.split('\n');
            let data = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line === '') {
                    continue;
                }

                const values = line.split(',');
                const numbers = values.map(value => parseFloat(value.trim()));

                if (numbers.every(number => !isNaN(number))) {
                    data.push(numbers);
                }
            }

            return data;
        }

        const trainingDataTextarea = document.getElementById('trainingData');
        let trainingData = [];

        trainingDataTextarea.addEventListener('input', function () {
            let csvText = trainingDataTextarea.value;
            trainingData = csvToArray(csvText);

            console.log(trainingData);

            updateMaxDepth(trainingData);
        });

        const treeDepthSlider = document.getElementById('treeDepth');
        const depthValueSpan = document.getElementById('depthValue');

        function updateMaxDepth(data) {
            const maxDepth = data.length > 0 ? data.length - 1 : 3;
            treeDepthSlider.max = maxDepth;
            treeDepthSlider.value = maxDepth;
            depthValueSpan.textContent = maxDepth;
        }

        treeDepthSlider.addEventListener('input', function () {
            depthValueSpan.textContent = treeDepthSlider.value;
        });

        function csvToFeaturesArray(csvText) {
            const lines = csvText.split('\n');
            const data = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line === '') {
                    continue;
                }

                const values = line.split(',');
                const numbers = values.map(value => parseFloat(value.trim()));

                if (numbers.every(number => !isNaN(number))) {
                    data.push(numbers);
                }
            }

            return data;
        }

        const testDataTextarea = document.getElementById('testData');
        let testFeatures = [];

        testDataTextarea.addEventListener('input', function () {
            let csvText = testDataTextarea.value;
            testFeatures = csvToFeaturesArray(csvText);

            console.log(testFeatures);
        });

        const taskTypeSelect = document.getElementById('taskType');
        const trainTreeButton = document.getElementById('trainTree');

        let decisionTree = null;

        trainTreeButton.addEventListener('click', function () {
            const taskType = taskTypeSelect.value;

            const depth = parseInt(depthValueSpan.textContent);

            const allIndexes = Array.from({ length: trainingData.length }, (_, i) => i);

            if (trainingData.length === 0) {
                alert("Пожалуйста, введите обучающие данные.");
                return;
            }

            if (decisionTree) {
                if (taskType === 'classification') {
                    deleteTreeClassification(decisionTree);
                    decisionTree = null;
                } else {
                    deleteTreeRegression(decisionTree);
                    decisionTree = null;
                }
            }

            if (taskType === 'classification') {
                decisionTree = buildTreeClassification(trainingData, allIndexes, depth);
                console.log("Дерево классификации построено:", decisionTree);
            } else if (taskType === 'regression') {
                decisionTree = buildTreeRegression(trainingData, allIndexes, depth);
                console.log("Дерево регрессии построено:", decisionTree);
            } else {
                alert("Пожалуйста, выберите тип задачи.");
            }

            const treeData = convertTreeToJSON(decisionTree);
            console.log(JSON.stringify(treeData, null, 2));
            visualizeTree(treeData);
        });

        const testButton = document.getElementById('testTree');
        const predictionResultInput = document.getElementById('predictionResult');

        testButton.addEventListener('click', function () {
            if (!decisionTree) {
                alert("Пожалуйста, сначала обучите дерево.");
                return;
            }

            if (testFeatures.length !== 1) {
                alert("Пожалуйста, введите ровно одну строку тестовых данных.");
                return;
            }

            const testData = testFeatures[0];
            const taskType = taskTypeSelect.value;

            let prediction;

            if (taskType === 'classification') {
                prediction = predictClassification(decisionTree, testData);
            } else if (taskType === 'regression') {
                prediction = predictRegression(decisionTree, testData);
            } else {
                alert("Пожалуйста, выберите тип задачи.");
                return;
            }

            predictionResultInput.textContent = prediction;
        }

function convertTreeToJSON(tree) {
                if (!tree) {
                    return null;
                }

                const json = {
                    name: tree.feature ? `Split on ${tree.feature} < ${tree.threshold}` : `Leaf`,
                    attributes: {
                        feature: tree.feature || null threshold: tree.threshold || null,
                        value: tree.value || null,
                        prediction: tree.prediction || null
                    },
                    children: []
                };

                if (tree.left) {
                    json.children.push(convertTreeToJSON(tree.left));
                }
                if (tree.right) {
                    json.children.push(convertTreeToJSON(tree.right));
                }

                return json;
            }

function visualizeTree(treeData) {
                d3.select("#tree-svg").selectAll("*").remove();

                const width = 960;
                const height = 500;

                const svg = d3.select("#tree-svg")
                    .attr("width", width)
                    .attr("height", height);

                const zoom = d3.zoom()
                    .scaleExtent([0.1, 3])
                    .on("zoom", zoomed);

                const g = svg.append("g").attr("transform", "translate(40,0)");

                svg.call(zoom);

                const tree = d3.tree().size([height - 100, width - 200]);

                const root = d3.hierarchy(treeData, d => d.children);

                tree(root);

                const link = g.selectAll(".link")
                    .data(root.links())
                    .enter().append("path")
                    .attr("class", "link")
                    .attr("d", d3.linkHorizontal()
                        .x(d => d.y)
                        .y(d => d.x))
                    .style("fill", "none")
                    .style("stroke", "#fff")
                    .style("stroke-width", "2px");

                const node = g.selectAll(".node")
                    .data(root.descendants())
                    .enter().append("g")
                    .attr("class", "node")
                    .attr("transform", d => `translate(${d.y},${d.x})`);

                node.append("circle")
                    .attr("r", 10)
                    .style("fill", "white")
                    .style("stroke", "steelblue")
                    .style("stroke-width", "3px");

                node.append("text")
                    .attr("dy", ".35em")
                    .attr("x", d => d.children ? -13 : 13)
                    .style("text-anchor", d => d.children ? "end" : "start")
                    .text(d => d.data.name);

                function zoomed({ transform }) {
                    g.attr("transform", transform);
                }
            }
    </script>
</body>
