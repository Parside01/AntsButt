<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Рисовалка</title>
    <link rel="stylesheet" href="root.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Underdog&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        li {
            display: list-item;
            text-align: -webkit-match-parent;
            unicode-bidi: isolate;
        }

        .dark-theme {
            display: flex;
            background-color: var(--dark-background);
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
        }

        .dark-theme .course__list {
            list-style: none;
            padding-left: 0;
            margin-top: 50px;
            width: 500px;
        }

        .dark-theme .course-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            height: auto;
            padding: 16px;
            border-radius: 24px;
            background-color: var(--dark-card-background);
            box-shadow: 0px 0px 6px 0px var(--yellow-shadow);
            color: var(--text);
            text-decoration: none;
            margin-bottom: 20px;
        }

        .dark-theme .course-card__content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dark-theme .course-card__info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dark-theme .course-card__title {
            font-weight: 500;
            font-size: 18px !important;
            line-height: 1.3em;
            margin-bottom: 0;
        }

        .dark-theme .course-card__card {
            width: 100%;
            height: auto;
            border: 1px solid black;
            border-radius: 12px;
            overflow: hidden;
        }

        .dark-theme .course-card__card canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .dark-theme .bttn-prime {
            background-color: var(--yellow-button-background);
            border-color: var(--yellow-button-background);
            color: var(--dark-button-text);
        }

        .dark-theme .bttn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px;
            gap: 8px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.5em;
            width: 100%;
        }

        .bttn.disable {
            background-color: var(--yellow-shadow);
            border-color: var(--yellow-shadow);
            color: var(--dark-button-text);
        }

        .modal-content {
            background-color: var(--dark-card-background);
            color: var(--text);
            border: 1px solid #8b8b8b;
        }

        .modal-header {
            border-bottom: 1px solid #8b8b8b;
        }

        .modal-title {
            color: var(--text);
        }

        .modal-body {
            color: var(--text);
        }

        .modal-footer {
            border-top: 1px solid #8b8b8b;
        }

        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
            color: var(--text);
        }

        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

        .shake {
            animation: shake 10s;
        }

        @keyframes shake {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            10% { transform: translate(-5px, 0px) rotate(-1deg); }
            20% { transform: translate(5px, 0px) rotate(1deg); }
            30% { transform: translate(-5px, 0px) rotate(0deg); }
            40% { transform: translate(5px, 0px) rotate(-1deg); }
            50% { transform: translate(-5px, 0px) rotate(1deg); }
            60% { transform: translate(5px, 0px) rotate(0deg); }
            70% { transform: translate(-5px, 0px) rotate(-1deg); }
            80% { transform: translate(5px, 0px) rotate(1deg); }
            90% { transform: translate(-5px, 0px) rotate(0deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
    </style>

</head>
<body class="dark-theme">
<ul class="course__list">
    <li class="course__item course-card">
        <div class="course-card__content">
            <div class="course-card__info">
                <h5>Рисовалка</h5>
            </div>
            <div class="course-card__card">
                <canvas id="canvas" width="480" height="480"></canvas>
            </div>
            <button id="sendButton" class="bttn bttn-prime">Иии крутить барабан</button>
        </div>
    </li>
</ul>

<ul class="course__list state__card" style="width: 400px">
    <li class="course__item course-card">
        <h5 class="card-title state state--default">Этот мир в безопасности</h5>
    </li>
</ul>

<div class="modal fade" id="predictionModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="predictionModalLabel">Предсказание</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Умная машина предсказывает: <strong id="prediction"></strong></p>
                <p>Что скажешь?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="correctButton">Правильно</button>
                <button type="button" class="btn btn-secondary" id="incorrectButton">Неверно</button>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function () {
        let correctIndex = 0;
        const correctTitles = {
            "-3": "Просто интернет плохой!! 🌐😩",
            "-2": "Даже машина может прокрастенировать ⏳🤖",
            "-1": "Эта машина еще правда учится 👉👈📚",
            "0": "Этот мир в безопасности 🌍🛡️",
            "1": "Эта машина действительно угадывает 🤔💡",
            "2": "Огооо мега угадывание 🚀✨",
            "3": "Она явно что-то знает.... 🤖🔍",
            "4": "Боюсь скоро она тебя заменит 😱🤖",
            "5": "Ну что, глупый человек? 😶‍🌫️😶‍🌫️",
            "6": "ТЫ ПОД ЗАМЕНУ ☠️☠️☠️"
        }

        const canvas = $('#canvas')[0];
        const context = canvas.getContext('2d');

        context.fillStyle = 'white';
        context.fillRect(0, 0, canvas.width, canvas.height);

        let painting = false;

        $('#canvas').on('mousedown', startPosition);
        $('#canvas').on('mouseup', endPosition);
        $('#canvas').on('mousemove', draw);

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function endPosition() {
            painting = false;
            context.beginPath();
        }

        function draw(e) {
            if (!painting) return;

            context.lineWidth = 40;
            context.lineCap = 'round';
            context.strokeStyle = 'black';

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            context.lineTo(x, y);
            context.stroke();
            context.beginPath();
            context.moveTo(x, y);
        }


        $('#sendButton').on('click', sendData);

        function sendData() {
            $('#prediction').text("");
            const predictionModal = new bootstrap.Modal($('#predictionModal'));
            predictionModal.show();

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 28;
            tempCanvas.height = 28;
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.drawImage(canvas, 0, 0, 28, 28);

            const imageData = tempCtx.getImageData(0, 0, 28, 28);
            const pixels = [];

            let grayscaleSum = 0;
            let pixelCount = 0;

            let hasNonZero = false;

            for (let i = 0; i < imageData.data.length; i += 4) {
                const r = imageData.data[i];
                const g = imageData.data[i + 1];
                const b = imageData.data[i + 2];
                const alpha = imageData.data[i + 3];

                if (alpha === 0) continue;

                const grayscale = 255 - (0.299 * r + 0.587 * g + 0.114 * b);
                const normalized = grayscale / 255;

                pixels.push(normalized);
                grayscaleSum += normalized;
                pixelCount++;

                if (normalized > 0.1) hasNonZero = true;
            }

            if (!hasNonZero) {
                alert('Нарисуйте цифру перед отправкой!');
                return;
            }

            const meanGrayscale = grayscaleSum / pixelCount;
            if (meanGrayscale > 0.5) {
                for (let i = 0; i < pixels.length; i++) {
                    pixels[i] = 1 - pixels[i];
                }
            }
            $.ajax({
                url: 'http://localhost:8081/pred',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({pixels}),
                success: function (data) {
                    console.log('Пришло:', data);
                    const prediction = data.prediction;

                    $('#loader').addClass('d-none');
                    $('#prediction').text(prediction);

                    $('#correctButton, #incorrectButton').one('click', function () {
                        context.fillStyle = 'white';

                        if ($(this).is('#correctButton')) {
                            correctIndex = Math.min(correctIndex + 1, 6);
                        } else {
                            $(".state__card").removeClass("shake");
                            correctIndex = Math.max(correctIndex - 1, -3);
                        }

                        const title = correctTitles[correctIndex];
                        $('.state').text(title);

                        if (correctIndex === 6) {
                            shakeElement($(".state__card"));
                        }

                        context.fillRect(0, 0, canvas.width, canvas.height);
                        predictionModal.hide();
                    });

                    function shakeElement(element) {
                        element.addClass('shake');
                    }
                },
                error: function (error) {
                    // alert('Произошла ошибка при отправке данных.');
                }
            });
        }
    });
</script>
</body>
</html>
