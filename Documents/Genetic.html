<!DOCTYPE html>
<html>

<head>
  <title>Web</title>
  <link rel="stylesheet" href="source/style1.css">

  <style>
    * {
      margin: 0px;
      padding: 0px;
    }

    #myCanvas {
      border: 1px solid black;
      background-color: #eeeeee;
      cursor: crosshair;
    }

    .canva {
      display: grid;
      place-items: center;
      height: 100vh;
    }

    #coordinates {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgb(255, 255, 255);
      padding: 5px 10px;
      border: 1px solid #000000;
      font-family: sans-serif;
      font-size: 15px;
    }

    #routeLength {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgb(255, 255, 255);
      padding: 5px 10px;
      border: 1px solid #000000;
      font-family: sans-serif;
      font-size: 15px;
    }

    #algorithmStatus {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgb(255, 255, 255);
      padding: 5px 10px;
      border: 1px solid #000000;
      font-family: sans-serif;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="canva">
    <canvas id="myCanvas" width="1000" height="600"></canvas>
  </div>
  <div id="coordinates"></div>

  <button id="runButton">Запустить алгоритм</button><br><br>

  Масштаб: <input type="range" id="scaleSlider" min="5" max="500" value="5" step="1"
    oninput="updateScaleValue(this.value)"><span id="scaleValue">5</span><br><br>


  Координаты X, Y: <input type="text" id="coordinateInput"><button id="addPointButton">Добавить точку</button><br>

  <script src="js/genethicAlgorithm.js"></script>
  <script src="js/script.js"></script>

  <script>
    function addCity(x, y) {
      let newCity = {
        number: cities.length + 1,
        x: x,
        y: y
      };

      cities.push(newCity);
    }

    function calculateDistance(city1, city2) {
      return Math.sqrt(((city2.x - city1.x) * (city2.x - city1.x)) + ((city2.y - city1.y) * (city2.y - city1.y)));
    }

    function randomNum(start, end) {
      const range = (end - start) + 1;
      const randomInt = start + Math.floor(Math.random() * range);

      return randomInt;
    }

    function calculateFitness(distance, chromosome) {
      let summa = 0;
      for (let i = 0; i < chromosome.length - 1; i++) {
        summa += distance[chromosome[i]][chromosome[i + 1]];
      }
      return summa;
    }

    class Individual {
      constructor(chromosome, distance) {
        this.chromosome = chromosome;
        this.fitness = calculateFitness(distance, chromosome);
      }
    }

    function createRandomIndividual(cityCount, distance) {
      let chromosome = new Array(cityCount + 1);

      let cityIndixes = new Array(cityCount - 1);
      for (let i = 0; i < cityCount - 1; i++) {
        cityIndixes[i] = i + 1;
      }

      for (let i = cityIndixes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cityIndixes[i], cityIndixes[j]] = [cityIndixes[j], cityIndixes[i]];
      }

      chromosome[0] = 0;

      for (let i = 0; i < cityCount - 1; ++i) {
        chromosome[i + 1] = cityIndixes[i];
      }

      chromosome[cityCount] = 0;

      return new Individual(chromosome, distance);
    }

    function createInitialPopulation(populationSize, cityCount, distance) {
      let population = [];

      for (let i = 0; i < populationSize; i++) {
        population.push(createRandomIndividual(cityCount, distance))
      }

      return population;
    }

    function mate(parent1, parent2, cityCount, distance) {
      let childChromosome = new Array(cityCount + 1);

      let crossoverPoint = randomNum(1, cityCount - 1);

      for (let i = 0; i <= crossoverPoint; i++) {
        childChromosome[i] = parent1.chromosome[i];
      }

      let currentIndex = crossoverPoint + 1;

      for (let i = 1; i < cityCount; i++) {
        let cityAlreadyPresent = false;
        for (let j = 0; j <= crossoverPoint; j++) {
          if (parent2.chromosome[i] === childChromosome[j]) {
            cityAlreadyPresent = true;
            break;
          }
        }

        if (!cityAlreadyPresent) {
          childChromosome[currentIndex] = parent2.chromosome[i];
          currentIndex++;
        }
      }

      for (let i = 1; i < cityCount; i++) {
        let cityAlreadyPresent = false;
        for (let j = 0; j < cityCount; j++) {
          if (parent1.chromosome[i] === childChromosome[j]) {
            cityAlreadyPresent = true;
            break;
          }
        }

        if (!cityAlreadyPresent && currentIndex <= cityCount - 1) {
          childChromosome[currentIndex] = parent1.chromosome[i];
          currentIndex++;
        }
      }

      childChromosome[cityCount] = 0;

      let mutationProbability = 0.2;
      let p = randomNum(0, 100) / 100.0;

      if (p < mutationProbability) {
        let index1 = randomNum(1, cityCount - 1);
        let index2 = randomNum(1, cityCount - 1);
        [childChromosome[index1], childChromosome[index2]] = [childChromosome[index2], childChromosome[index1]];
      }

      return new Individual(childChromosome, distance);
    }

    function compareIndividuals(individual1, individual2) {
      return individual1.fitness - individual2.fitness;
    }

    function drawRoute(chromosome, cities, ctx, transformCoordinates) {
      ctx.beginPath();
      ctx.strokeStyle = 'gray';
      ctx.lineWidth = 2;

      let transformed = transformCoordinates(cities[chromosome[0]].x, cities[chromosome[0]].y);
      ctx.moveTo(transformed.x, transformed.y);

      ctx.beginPath();
      ctx.arc(transformed.x, transformed.y, 6, 0, 2 * Math.PI);
      ctx.fillStyle = 'green';
      ctx.fill();

      for (let i = 1; i < chromosome.length; i++) {
        if (chromosome[i] >= cities.length) {
          console.error("Неверный индекс города в хромосоме:", chromosome[i], "Длина массива городов:", cities.length);
          return;
        }

        transformed = transformCoordinates(cities[chromosome[i]].x, cities[chromosome[i]].y);
        ctx.lineTo(transformed.x, transformed.y);
      }

      ctx.stroke();
    }

    function clearRoute(canvas, ctx, cities, drawPoint, transformCoordinates) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < cities.length; i++) {
        drawPoint(cities[i].x, cities[i].y, ctx, transformCoordinates);
      }
    }
  </script>

  <script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    const coordinatesDiv = document.getElementById('coordinates');

    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;
    const runButton = document.getElementById('runButton');

    const scaleSlider = document.getElementById('scaleSlider');
    const scaleValue = document.getElementById('scaleValue');

    const coordinateInput = document.getElementById('coordinateInput');
    const addPointButton = document.getElementById('addPointButton');

    let cities = [];

    let scale;

    function updateScaleValue(value) {
      scale = parseFloat(value);
      scaleValue.textContent = value;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < cities.length; i++) {
        drawPoint(cities[i].x, cities[i].y, ctx, transformCoordinates);
      }
    }

    function transformCoordinates(x, y) {
      return {
        x: (canvasWidth / 2) + (x * canvasWidth / (2 * scale)),
        y: (canvasHeight / 2) - (y * canvasHeight / (2 * scale))
      };
    }

    function drawPoint(x, y, ctx, transformCoordinates) {
      const transformed = transformCoordinates(x, y);

      ctx.beginPath();
      ctx.arc(transformed.x, transformed.y, 4, 0, 2 * Math.PI);
      ctx.fillStyle = 'black';
      ctx.fill();
    }

    canvas.addEventListener('mousemove', function (event) {
      const x = event.offsetX;
      const y = event.offsetY;

      const worldCoordinates = {
        x: (x - (canvasWidth / 2)) * (2 * scale) / canvasWidth,
        y: ((canvasHeight / 2) - y) * (2 * scale) / canvasHeight
      };

      coordinatesDiv.textContent = `X: ${worldCoordinates.x.toFixed(2)}, Y: ${worldCoordinates.y.toFixed(2)}`;
    });

    canvas.addEventListener('click', function (event) {
      const x = event.offsetX;
      const y = event.offsetY;

      const worldCoordinates = {
        x: (x - (canvasWidth / 2)) * (2 * scale) / canvasWidth,
        y: ((canvasHeight / 2) - y) * (2 * scale) / canvasHeight
      };

      cities.push({ x: worldCoordinates.x, y: worldCoordinates.y });
      drawPoint(worldCoordinates.x, worldCoordinates.y, ctx, transformCoordinates);
      console.log(cities);
    });

    addPointButton.addEventListener('click', function () {
      const coordinates = coordinateInput.value.split(/[, ]+/);
      const x = parseFloat(coordinates[0]);
      const y = parseFloat(coordinates[1]);

      if (!isNaN(x) && !isNaN(y)) {
        const worldCoordinates = { x: x, y: y };
        cities.push(worldCoordinates);
        drawPoint(worldCoordinates.x, worldCoordinates.y, ctx, transformCoordinates);

        console.log(cities);
      }
      else {
        alert("Введите корректные координаты X и Y через запятую или пробел.");
      }
    });

    function voidGenethicAlgorithm(cities) {
      let populationCount = 300;
      let cityCount = cities.length;

      let distance = new Array(cityCount);
      for (let i = 0; i < cityCount; i++) {
        distance[i] = new Array(cityCount);
        for (let j = 0; j < cityCount; j++) {
          distance[i][j] = (i === j) ? 0 : calculateDistance(cities[i], cities[j]);
        }
      }

      let currentGeneration = 0;
      let population = createInitialPopulation(populationCount, cityCount, distance);

      function iterate() {
        if (currentGeneration >= 2000) {
          console.log("Алгоритм завершен!");
          return;
        }

        let newGeneration = [];

        population.sort(compareIndividuals);

        let eliteSize = Math.round((20.0 * populationCount) / 100.0);
        for (let i = 0; i < eliteSize; i++) {
          newGeneration.push(population[i]);
        }

        while (newGeneration.length < populationCount) {
          let r = randomNum(0, population.length - 1);
          let parent1 = population[r];
          r = randomNum(0, population.length - 1);
          let parent2 = population[r];
          let child = mate(parent1, parent2, cityCount, distance);
          newGeneration.push(child);
        }

        population = newGeneration;

        clearRoute(canvas, ctx, cities, drawPoint, transformCoordinates);
        drawRoute(population[0].chromosome, cities, ctx, transformCoordinates);

        currentGeneration++;

        console.log("Generation:", currentGeneration, "Best Fitness:", population[0].fitness);

        requestAnimationFrame(() => setTimeout(iterate, 200));
      }

      iterate();
    }

    runButton.addEventListener('click', function () {
      if (cities.length < 3) {
        alert("Добавьте хотя бы 3 города!");
        return;
      }

      voidGenethicAlgorithm(cities);
    });


    window.addEventListener('load', function () {
      updateScaleValue(scaleSlider.value);
    });

    scaleSlider.addEventListener('input', function () {
      updateScaleValue(scaleSlider.value);
    });
  </script>

</body>

</html>
