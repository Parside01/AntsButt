<style>
    li {
        display: list-item;
        text-align: -webkit-match-parent;
        unicode-bidi: isolate;
    }

    .course-card__catalog {
        color: #8b8b8b;
        font-size: 14px;
        display: -webkit-box;
        -webkit-line-clamp: 1;
    }

    .dark-theme {
        margin-left: 200px;
        margin-right: 200px;
        margin-top: 50px;
        margin-bottom: 50px;
        list-style: none;
        display: grid;
        padding-left: 0;
        gap: 32px;
        grid-template-columns: repeat(2, 1fr);
    }

    .course-card__info--line {
        display: flex;
        margin-top: 25px;
        align-items: center;
        gap: 8px;
    }


    .dark-theme .course-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        height: 100%;
        padding: 16px;
        border-radius: 24px;
        background-color: var(--dark-card-background);
        box-shadow: 0px 0px 6px 0px var(--yellow-shadow);
        color: var(--text);
        text-decoration: none;
    }

    .dark-theme .course-card__content {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-grow: 1;
    }


    .dark-theme .course-card__info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;
    }

    .dark-theme .course-card__title {
        font-weight: 500;
        font-size: 18px !important;
        line-height: 1.3em;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
        margin-bottom: 0;
    }

    .dark-theme .course-card__list {
        list-style: none;
        margin-bottom: 0;
        padding-left: 0;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }


    .dark-theme .course-card__plate {
        padding: 4px 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        border-radius: 38px;
        font-size: 14px;
    }

    .dark-theme .course-card__card {
        width: 150px;
        height: 100%;
        flex-shrink: 0;
    }

    .dark-theme .bttn-prime {
        background-color: var(--yellow-button-background);
        border-color: var(--yellow-button-background);
        color: var(--dark-button-text);
    }

    .bttn {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px 16px;
        gap: 8px;
        border: 2px solid transparent;
        border-radius: 12px;
        font-size: 16px;
        line-height: 1.5em;
    }

    .bttn {
        transition: transform 0.1s ease-in-out;
    }

    .bttn:hover {
        transform: scale(0.95);
    }

    .bttn:active {
        transform: scale(0.9);
    }

    .bttn.disable {
        background-color: var(--yellow-shadow);
        border-color: var(--yellow-shadow);
        color: var(--dark-button-text);
    }


    .dark-theme .course-card__card-img {
        display: block;
        width: 100%;
        filter: brightness(80%);
    }

    a {
        text-decoration: none;
    }
</style>
